name: Bootstrap audited v0.1.0 release

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify audited source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source-*.b64 | tr -d '\r\n' | base64 --decode > /tmp/labauto-source.tar.xz
          echo "904de9f96a46305d3138b40baf54ac710af0242d6dd3356c2b59f8f416a0a220  /tmp/labauto-source.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/labauto-source.tar.xz
          test -s pyproject.toml
          test -s paper/main.tex
          test -s data/derived/evidence_register.csv

      - name: Add reproducible graphical-abstract generator and archive note
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > artifacts/README.md <<'EOF'
          # Retained research artifact

          The analysis workbook is retained in the immutable local release package and will be attached to the archival DOI record. The ordinary repository reproduction path uses the committed derived CSV, JSON, and YAML records and does not require the workbook.
          EOF
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "artifacts/              Retained research workbook snapshot",
              "artifacts/              Archive and provenance notes",
          )
          path.write_text(text, encoding="utf-8")
          PY
          cat > scripts/build_graphical_abstract.py <<'PY'
          #!/usr/bin/env python3
          """Build the boundary-centered graphical abstract."""

          from pathlib import Path

          import matplotlib.pyplot as plt
          from matplotlib.patches import FancyArrowPatch, FancyBboxPatch

          ROOT = Path(__file__).resolve().parents[1]
          OUTPUT = ROOT / "paper" / "graphical_abstract.png"
          OUTPUT_PDF = ROOT / "paper" / "graphical_abstract.pdf"


          def box(ax: plt.Axes, x: float, y: float, width: float, height: float, title: str, body: str) -> None:
              patch = FancyBboxPatch(
                  (x, y),
                  width,
                  height,
                  boxstyle="round,pad=0.012,rounding_size=0.012",
                  facecolor="#e4eef5",
                  edgecolor="#c7cdd1",
                  linewidth=1.5,
              )
              ax.add_patch(patch)
              ax.text(x + 0.02, y + height * 0.65, title, fontsize=17, fontweight="bold", va="center")
              ax.text(x + 0.02, y + height * 0.27, body, fontsize=12.5, va="center")


          def arrow(ax: plt.Axes, y_top: float, y_bottom: float) -> None:
              ax.add_patch(
                  FancyArrowPatch(
                      (0.5, y_top),
                      (0.5, y_bottom),
                      arrowstyle="-|>",
                      mutation_scale=17,
                      linewidth=1.5,
                  )
              )


          def main() -> None:
              fig, ax = plt.subplots(figsize=(12, 5.3))
              ax.set_xlim(0, 1)
              ax.set_ylim(0, 1)
              ax.axis("off")
              ax.text(
                  0.5,
                  0.955,
                  "Boundary-centered model of public laboratory-automation bottlenecks",
                  ha="center",
                  va="center",
                  fontsize=19,
                  fontweight="bold",
              )
              box(
                  ax,
                  0.04,
                  0.735,
                  0.92,
                  0.145,
                  "Ecosystem knowledge and support",
                  "B1  Knowledge packaging     B10  Documentation, training, support",
              )
              arrow(ax, 0.73, 0.695)
              box(
                  ax,
                  0.04,
                  0.535,
                  0.92,
                  0.145,
                  "Interfaces and representations",
                  "B2  Device access     B3  Deployment identity     B4  Physical resources",
              )
              arrow(ax, 0.53, 0.495)
              box(
                  ax,
                  0.04,
                  0.335,
                  0.92,
                  0.145,
                  "Runtime coordination",
                  "B5  Observability     B6  Recovery     B7  Scheduling",
              )
              arrow(ax, 0.33, 0.295)
              box(ax, 0.04, 0.135, 0.57, 0.145, "Evaluation", "B8  Test–claim alignment")
              box(
                  ax,
                  0.64,
                  0.135,
                  0.32,
                  0.145,
                  "Emerging AI",
                  "B9  Context and physical feedback",
              )
              ax.text(
                  0.5,
                  0.055,
                  "The model organizes analytical constructs; it does not claim exhaustiveness or population prevalence.",
                  ha="center",
                  va="center",
                  fontsize=11.5,
              )
              fig.savefig(OUTPUT, dpi=180, bbox_inches="tight")
              fig.savefig(OUTPUT_PDF, bbox_inches="tight")
              plt.close(fig)


          if __name__ == "__main__":
              main()
          PY

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install, validate, test, and reproduce
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/labauto_observatory
          uv run python scripts/validate_release.py
          uv run pytest
          uv run python scripts/reproduce_results.py
          uv run python scripts/build_figures.py
          uv run python scripts/build_tables.py
          uv run python scripts/build_graphical_abstract.py

      - name: Compile manuscript package
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/main.tex
            paper/supplement.tex
            paper/cover_letter.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false

      - name: Replace bootstrap with release source and create tag
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Lab Automation Forum Bottleneck Observatory v0.1.0"
          git tag -a v0.1.0 -m "Lab Automation Forum Bottleneck Observatory v0.1.0"
          git push origin HEAD:main
          git push origin v0.1.0

      - name: Publish immutable release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.0
          name: Lab Automation Forum Bottleneck Observatory v0.1.0
          generate_release_notes: true
          files: |
            paper/main.pdf
            paper/supplement.pdf
            paper/cover_letter.pdf
            paper/highlights.txt
            paper/graphical_abstract.png
            build/results.json
