name: Docs site

# Manual dispatch, like every other workflow in this repository: authoritative
# checks run locally, and a hosted runner is spent only when a maintainer asks
# for a deployment. The build job is a superset of `make docs-build`, with the
# release validation in front of it so a site is never published from data that
# has drifted from its generators.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing: a
# cancelled `deploy-pages` can leave the Pages environment on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - name: Fail if any generated artifact has drifted
        run: uv run python scripts/validate_release.py
      - name: Regenerate the browsable atlas summary
        run: uv run python scripts/build_atlas_summary.py
      - name: Build the site with warnings escalated to errors
        run: uv run mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
