name: Paper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run python scripts/reproduce_results.py
      - run: uv run python scripts/build_figures.py
      - run: uv run python scripts/build_tables.py
      - run: uv run python scripts/build_graphical_abstract.py
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/main.tex
            paper/supplement.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript
          path: |
            paper/main.pdf
            paper/supplement.pdf
            paper/highlights.txt
