name: Paper

# Manuscript sources under paper/ are local-only and are not present in the
# public repository. This workflow is retained as a disabled stub so historical
# workflow links do not 404; it always exits without building.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Manuscript build disabled
        run: |
          echo "paper/ is local-only and is not published to this repository."
          echo "Compile manuscripts on a machine that holds the private paper/ tree."
          exit 0
