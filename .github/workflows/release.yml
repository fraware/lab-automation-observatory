name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run python scripts/validate_release.py
      - run: uv run pytest
      - run: uv run python scripts/reproduce_results.py
      - run: uv run python scripts/build_figures.py
      - run: uv run python scripts/build_tables.py
      - run: uv run python scripts/build_graphical_abstract.py
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/main.tex
            paper/supplement.tex
            paper/cover_letter.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
      - name: Publish immutable release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            paper/main.pdf
            paper/supplement.pdf
            paper/cover_letter.pdf
            paper/highlights.txt
            paper/graphical_abstract.png
            build/results.json
