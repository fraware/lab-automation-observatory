name: Release

# Public releases publish data/code checksums only. Manuscript PDFs, LaTeX
# sources, graphical abstracts, and venue submission ZIPs stay local and must
# not be uploaded as GitHub Release assets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that must match v0.1.5* and the ref being built"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Require v0.1.5* tag input
        run: |
          case "${{ inputs.tag }}" in
            v0.1.5*) ;;
            *)
              echo "tag input must match v0.1.5*; got: ${{ inputs.tag }}"
              exit 1
              ;;
          esac
          git rev-parse --verify "refs/tags/${{ inputs.tag }}"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: uv run python scripts/validate_release.py
      - run: uv run pytest
      - run: uv run python scripts/reproduce_results.py
      - name: Publish data-and-code release assets only
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          body: |
            Public release assets are limited to reproducible data and code.
            Manuscript PDFs, LaTeX sources, and venue submission bundles are local-only and are not published here.
          files: |
            build/results.json
