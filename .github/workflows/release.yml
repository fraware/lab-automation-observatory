name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that must match v0.1.4* and the ref being built"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Require v0.1.4* tag input
        run: |
          case "${{ inputs.tag }}" in
            v0.1.4*) ;;
            *)
              echo "tag input must match v0.1.4*; got: ${{ inputs.tag }}"
              exit 1
              ;;
          esac
          git rev-parse --verify "refs/tags/${{ inputs.tag }}"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: uv run python scripts/validate_release.py
      - run: uv run pytest
      - run: uv run python scripts/reproduce_results.py
      - run: uv run python scripts/build_figures.py
      - run: uv run python scripts/build_tables.py
      - run: uv run python scripts/build_graphical_abstract.py
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            paper/main.tex
            paper/supplement.tex
            paper/cover_letter.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
      - name: Build submission bundle
        run: |
          CERT_SHA="$(git rev-parse HEAD)"
          uv run python scripts/build_submission_bundle.py \
            --certification-sha "$CERT_SHA" \
            --manifest artifacts/submission_bundle_manifest_v0.1.4.yaml \
            --output-dir artifacts/bundles
      - name: Publish immutable release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            paper/main.pdf
            paper/supplement.pdf
            paper/cover_letter.pdf
            paper/highlights.txt
            paper/graphical_abstract.png
            artifacts/submission_bundle_manifest_v0.1.4.yaml
            artifacts/bundles/*.zip
            artifacts/bundles/SHA256SUMS.txt
            artifacts/bundles/data-and-code-source.zip
            artifacts/bundles/bundle-SHA256SUMS.txt
            build/results.json
