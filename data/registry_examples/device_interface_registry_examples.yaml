  last_activity_observed: '2025'
  last_verified: '2026-07-29'
  correction_status: active
  evidence_grade: 1
  evidence_confidence: High
  evidence_note: A public forum answer identifies a REST API that ships disabled
    by default in VENUS 6 and gives explicit activation steps; no independent
    hardware reproduction is reported in the thread.
  evidence_sources:
  - https://labautomation.io/t/hamilton-venus-6-com-interface-different-from-venus-4/5834
  known_limitations:
  - Applies to the VENUS 6.x REST API path only; does not describe VENUS 4 COM
    behavior or later VENUS releases.
