# Seed records for the device-interface accessibility registry (Roadmap 0.2).
# The registry itself is still a design draft: see docs/device-interface-registry.md
# and schemas/device-interface-registry.schema.json.
#
# These seven records seed the registry: six cover every B2 case the pilot
# published (one record per case), and one community-intake example without
# `pilot_case_id` shows how a new device/interface path is submitted.
# `make validate` (labauto_observatory.registry) requires its six accessibility
# components, unknown_components, accessibility_score, and source URL to equal
# that published case exactly. The registry adds the maintenance, lifecycle,
# evidence-grade, and prohibited-claim fields the fixed metric file has no place
# for; it does not restate, rescore, or extend the pilot's numbers.
#
# A contributed record about a device the pilot never coded omits `pilot_case_id`
# and is checked against the schema and the shared invariants only. See the
# contribution section of docs/device-interface-registry.md.
