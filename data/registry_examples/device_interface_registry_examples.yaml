# Draft example records for the device-interface accessibility registry (Roadmap 0.2).
# Design draft only: see docs/device-interface-registry.md and
# schemas/device-interface-registry.schema.json. Not wired into make validate or
# make reproduce. Derived from the existing B2 cases in
# data/metrics/b2_integration_access.csv; accessibility_score values match the
# corresponding IAS values in that file exactly, because both are the mean over
# the same six known components.
- record_id: DIR-2026-0001
  vendor: Hamilton
  product: VENUS method-control software
  interface_identity: VENUS 6.x REST API (disabled by default)
  interface_class: rest_api
  documentation: 1
  api_protocol: 1
  licence_clarity: 0.5
  simulator_isolated_testing: 0.5
  examples_reference_implementation: 0.5
  maintainer_support_declared: 0.5
  unknown_components: 0
  accessibility_score: 0.6666666666666666
  maintenance_status: active
  last_activity_observed: '2025'
  last_verified: '2026-07-29'
  correction_status: active
  evidence_grade: 1
  evidence_confidence: High
  evidence_note: A public forum answer identifies a REST API that ships disabled
    by default in VENUS 6 and gives explicit activation steps; no independent
    hardware reproduction is reported in the thread.
  evidence_sources:
  - https://labautomation.io/t/hamilton-venus-6-com-interface-different-from-venus-4/5834
  known_limitations:
  - Applies to the VENUS 6.x REST API path only; does not describe VENUS 4 COM
    behavior or later VENUS releases.
  - Full API method coverage beyond method-control activation is not established
    by this thread.
  prohibited_claims:
  - Must not be used to rank Hamilton against other vendors on interface
    accessibility or reliability.
  - Must not be read as confirmation that the REST API is officially supported
    for production use.
  record_steward: Lab Automation Observatory maintainers
  supersedes: []
  superseded_by: []
