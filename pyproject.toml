[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labauto-observatory"
version = "0.1.1"
description = "Reproducible metrics and community artifacts for the Lab Automation Forum Bottleneck Observatory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Matéo H. Petel"}
]
keywords = [
  "laboratory automation",
  "lab robotics",
  "technical communities",
  "mixed methods",
  "reproducible research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jsonschema>=4.23",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
labauto-observatory = "labauto_observatory.cli:app"

[project.urls]
Homepage = "https://github.com/fraware/lab-automation-observatory"
Repository = "https://github.com/fraware/lab-automation-observatory"
Issues = "https://github.com/fraware/lab-automation-observatory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/labauto_observatory"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["paper/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
# En dashes are intentional in construct labels such as "Test–claim alignment".
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Typer expresses option metadata through calls in argument defaults.
"src/labauto_observatory/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["labauto_observatory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=labauto_observatory --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
